# ──────────────────────────────────────────────────────────────────────────────
# Nginx config — example reverse proxy for the Streamlit app
# Replace `your-app-domain.example.com` with your actual domain
# ──────────────────────────────────────────────────────────────────────────────

# ── Block 1: Redirect all HTTP → HTTPS ────────────────────────────────────────
server {
    listen 80;
    server_name your-app-domain.example.com;

    # Force HTTPS — prevents browsers from showing "Not Secure"
    return 301 https://$host$request_uri;
}

# ── Block 2: HTTPS — serve the Streamlit app ──────────────────────────────────
server {
    listen 443 ssl;
    server_name your-app-domain.example.com;

    # ── SSL certificate (update paths to match actual cert location on server) ──
    # Use fullchain.crt (cert + intermediate) — NOT just the end cert alone.
    ssl_certificate     /etc/ssl/certs/fullchain.crt;
    ssl_certificate_key /etc/ssl/certs/privkey.key;

    # ── TLS settings ──────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;

    # ── Proxy to Streamlit ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://sop_chatbot:8501;
        proxy_http_version 1.1;

        # Required for Streamlit WebSocket (live updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
    }
}
